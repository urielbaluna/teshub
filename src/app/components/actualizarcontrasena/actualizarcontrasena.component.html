<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Actualizar Contraseña - Teshub</title>
  <style>
    body {
      background-color: #e6e6e6;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: white;
      padding: 40px 30px;
      border-radius: 20px;
      width: 300px;
      text-align: center;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .logo span:first-child {
      color: #444;
    }

    .logo span:last-child {
      background-color: #2ca646;
      color: white;
      padding: 2px 8px;
      border-radius: 5px;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .input-group input {
      width: 85%;
      padding: 10px 10px 10px 40px;
      border: none;
      background-color: #e6e6e6;
      border-radius: 10px;
      font-size: 14px;
    }

    .input-group i {
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      color: #555;
    }

    .label-text {
      text-align: left;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #333;
    }

    .btn-update {
      background-color: #2ca646;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 10px;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">
      <span>tes</span><span>hub</span>
    </div>
    
    <div class="input-group">
      <i>#</i>
      <input type="text" placeholder="CÓDIGO DE SEGURIDAD" required>
    </div>

    <div class="label-text">Ingresa tu nueva contraseña:</div>

    <div class="input-group">
      <i>🔒</i>
      <input type="password" placeholder="CONTRASEÑA NUEVA" required>
    </div>

    <div class="input-group">
      <i>🔒</i>
      <input type="password" placeholder="REESCRIBE TÚ CONTRASEÑA NUEVA" required>
    </div>

    <button class="btn-update">ACTUALIZAR</button>
  </div>

</body>
</html>
