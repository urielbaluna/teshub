<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Teshub</title>
  <style>
    body {
      background-color: #e6e6e6;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-container {
      background-color: white;
      padding: 40px 30px;
      border-radius: 20px;
      width: 300px;
      text-align: center;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .logo span:first-child {
      color: #444;
    }

    .logo span:last-child {
      background-color: #2ca646;
      color: white;
      padding: 2px 8px;
      border-radius: 5px;
    }

    .input-group {
      position: relative;
      margin-bottom: 10px;
    }

    .input-group input {
      width: 80%;
      padding: 15px 15px 12px 40px;
      border: none;
      background-color: #e6e6e6;
      border-radius: 20px;
      font-size: 14px;
    }

    .input-group i {
      position: absolute;
      top: 50%;
      left: 10px;
      transform: translateY(-50%);
      color: #555;
    }

    .btn-login {
      background-color: #2ca646;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 10px;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }

    .login-footer {
      font-size: 12px;
      margin-top: 15px;
      color: #333;
    }

    .login-footer a {
      color: #000;
      text-decoration: none;
      display: block;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="login-container">
  <div class="logo">
    <span>tes</span><span>hub</span>
  </div>
  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
    <div class="input-group">
      <i>📧</i>
      <input type="email" placeholder="CORREO ELECTRONICO" required [(ngModel)]="correo" name="correo">
    </div>
    <div class="input-group">
      <i>🔒</i>
      <input type="password" placeholder="CONTRASEÑA" required [(ngModel)]="contrasena" name="contrasena">
    </div>
    <button class="btn-login" type="submit" [disabled]="loginForm.invalid">ACCEDER</button>
    <div *ngIf="mensaje">{{ mensaje }}</div>
  </form>
  <div class="login-footer">
    <a routerLink="/correorecuperacion">¿Olvidaste tu contraseña?</a>
    <br>
    o
    <br>
    <a routerLink="/crearcuenta">Crear cuenta nueva</a>
  </div>
</div>

</body>
</html>
