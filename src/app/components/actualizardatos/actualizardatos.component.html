<div class="header" style="display:flex;align-items:center;justify-content:space-between;padding:10px 32px;width:100%;border-radius:0;box-shadow:0 2px 8px rgba(0,0,0,0.04);background:#fff;">
  <img src="assets/tes_hub.png" alt="teshub logo" style="height:44px;cursor:pointer;" (click)="irAHome()">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">
</div>

<div class="form-container" style="margin-top:32px; position:relative;">
  <div class="profile-container">
    <div class="profile-container" style="position:relative;">
      <img [src]="foto" alt="Imagen de Perfil" class="profile-image">
      <!-- Ícono para actualizar imagen -->
      <label for="fileInput" style="position:absolute;bottom:10px;left:50%;transform:translateX(-50%);cursor:pointer;">
        <i class="fi fi-rr-camera" style="font-size:28px;color:#2ca646;background:#fff;border-radius:50%;padding:6px;box-shadow:0 2px 8px #0002;"></i>
        <input id="fileInput" type="file" accept="image/*" (change)="onImagenSeleccionada($event)" style="display:none;">
      </label>
    </div>
  </div>
  <h2>Actualizar Datos</h2>
  <form (ngSubmit)="actualizarDatos()">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" [(ngModel)]="nombre">

    <label for="apellido">Apellido:</label>
    <input type="text" id="apellido" name="apellido" [(ngModel)]="apellido">

    <label for="correo">Correo electrónico:</label>
    <input type="email" id="correo" name="correo" [(ngModel)]="correo">

    <label for="password">Contraseña:</label>
    <input type="password" id="password" name="password" [(ngModel)]="password">

    <button type="submit">ACTUALIZAR</button>
    <!-- Modal de éxito al actualizar datos -->
    <div *ngIf="modalExito" class="modal-backdrop">
      <div class="modal-content" style="min-width:300px;text-align:center;">
        <h3 style="margin:24px 0 12px 0;">¡Datos actualizados exitosamente!</h3>
        <button (click)="cerrarModalExito()" style="margin:18px auto 0 auto;display:block;background:#2ca646;color:#fff;border:none;border-radius:8px;padding:8px 24px;font-weight:bold;cursor:pointer;">
          Cerrar
        </button>
      </div>
    </div>
  </form>
</div>
