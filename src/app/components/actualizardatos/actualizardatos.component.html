<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualizar Datos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      padding: 20px;
    }
    /* Estilos para el contenedor de la imagen de perfil */
    .profile-container {
      text-align: center;
      margin-bottom: 20px;
    }
    /* Estilos para la imagen de perfil */
    .profile-image {
      border-radius: 50%;
      width: 150px;
      height: 150px;
    }
    /* Estilos para el contenedor del formulario */
    .form-container {
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .form-container input {
      width: 90%;
      padding: 8px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .form-container button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: #fff;
      border: none;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    .form-container button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
 
  

  <div class="form-container">
    <div class="profile-container">
    <img src="assets/img/brian.png" alt="Imagen de Perfil" class="profile-image">
  </div>
    <h2>    Actualizar Datos</h2>
    <form>
      <label for="codigo">Código de seguridad:</label>
      <input type="text" id="codigo" name="codigo" value="202124003">
      
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" value="Uriel">
      
      <label for="apellido">Apellido:</label>
      <input type="text" id="apellido" name="apellido" value="Barrera Luna">
      
      <label for="correo">Correo electrónico:</label>
      <input type="email" id="correo" name="correo" value="uriel_bl1@tesch.edu.mx">
      
      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" value="uriel1234$">
      
      <button type="submit">ACTUALIZAR</button>
    </form>
  </div>
</body>
</html>
