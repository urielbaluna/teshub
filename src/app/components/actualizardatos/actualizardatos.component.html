<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualizar Datos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      padding: 20px;
    }
    
    /* Estilos para el contenedor de la imagen de perfil */
    .profile-container {
      text-align: center;
      margin-bottom: 20px;
    }
    /* Estilos para la imagen de perfil */
    .profile-image {
      border-radius: 50%;
      width: 150px;
      height: 150px;
    }
    /* Estilos para el contenedor del formulario */
    .form-container {
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .form-container input {
      width: 90%;
      padding: 8px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .form-container button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: #fff;
      border: none;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    .form-container button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <a routerLink="/home" style="
    position: fixed;
    top: 20px;
    left: 20px;
    
  ">
  <img src="assets/tes_hub.png" alt="Home" style="width:150px; height:36px; object-fit:contain;">
</a>
  
 
  

  <div class="form-container">
  <div class="profile-container">
    <div class="profile-container" style="position:relative;">
  <img [src]="foto" alt="Imagen de Perfil" class="profile-image">
  <!-- Ícono para actualizar imagen -->
  <label for="fileInput" style="position:absolute;bottom:10px;left:50%;transform:translateX(-50%);cursor:pointer;">
    <i class="fi fi-rr-camera" style="font-size:28px;color:#2ca646;background:#fff;border-radius:50%;padding:6px;box-shadow:0 2px 8px #0002;"></i>
    <input id="fileInput" type="file" accept="image/*" (change)="onImagenSeleccionada($event)" style="display:none;">
  </label>
</div>
  </div>
  <h2>Actualizar Datos</h2>
  <form (ngSubmit)="actualizarDatos()">
    
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" [(ngModel)]="nombre">

    <label for="apellido">Apellido:</label>
    <input type="text" id="apellido" name="apellido" [(ngModel)]="apellido">

    <label for="correo">Correo electrónico:</label>
    <input type="email" id="correo" name="correo" [(ngModel)]="correo">

    <label for="password">Contraseña:</label>
    <input type="password" id="password" name="password" [(ngModel)]="password">

    
    <button type="submit">ACTUALIZAR</button>
    <div *ngIf="mensaje" style="margin-top: 10px; color: red;">{{ mensaje }}</div>
  </form>
</div>
</body>
</html>
