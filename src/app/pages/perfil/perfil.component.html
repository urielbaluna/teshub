<div class="perfil-container">

  <div class="perfil-header" style="position: relative;">
    <img [src]="usuario.imagen || 'assets/default-user.png'" alt="Foto de perfil" class="foto-perfil">
    <div class="datos-usuario">
      <h2 class="nombre">{{ usuario.nombre }} {{ usuario.apellido }}</h2>
      <p class="rol">{{ usuario.rol }}</p>
      <p style="margin: 8px 0 0 0; font-weight: bold;">
        Publicaciones en las que participa: {{ usuario.total_publicaciones }}
      </p>
    </div>

    <!-- Botón dentro del recuadro de datos del usuario -->
    <button (click)="cerrarVerPerfil()" class="btn-cerrar-modal"
      style="position: absolute; top: 18px; right: 18px; background: transparent; border: none; cursor: pointer; z-index: 10;">
      <i class="fi fi-rr-notdef" style="font-size: 28px; color: #888;"></i>
    </button>
  </div>

  <div class="proyectos-section">
    <h3>Mis proyectos:</h3>

    <div *ngFor="let proyecto of usuario.publicaciones" class="proyecto-card">
      <div class="nombre-proyecto">{{ proyecto.proyecto_nombre }}</div>
      <div class="proyecto-info">
        <span class="fecha">{{ proyecto.hace_cuanto }}</span>
      </div>
    </div>
  </div>
</div>
